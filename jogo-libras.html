<style>

/* ============================================================
   ESTRUTURA GERAL
   ============================================================ */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
}

/* ============================================================
   TELAS
   Cada tela ocupa 100% da janela e exibe uma imagem de fundo.
   Para trocar a imagem de uma tela, altere o background-image
   da classe correspondente.
   ============================================================ */
.tela {
  display: none;
  width: 100%;
  height: 100%;
  position: relative;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: 100% 100%;
  background-color: #fff;
}
.tela.ativa {
  display: block;
}

/* Imagens de fundo de cada tela */
#tela-escola        { background-image: url(escola.jpg); cursor: pointer; }
#tela-mapa          { background-image: url(mapa.png); }
#tela-biblioteca    { background-image: url(biblioteca.png); }
#tela-brinquedoteca { background-image: url(brinquedoteca.png); }
#tela-parquinho     { background-image: url(parquinho.png); }
#tela-refeitorio    { background-image: url(refeitorio.png); }
#tela-sala-aula     { background-image: url(sala-de-aula.png); }
#tela-informatica   { background-image: url(sala-de-informatica.png); }
#tela-atelier       { background-image: url(ateliê.png); }

/* ============================================================
   HOTSPOTS — ÁREAS CLICÁVEIS INVISÍVEIS
   ============================================================

   Como ajustar a posição e o tamanho de um hotspot:

   Cada hotspot tem 4 propriedades no estilo inline:
     left   → distância da borda ESQUERDA da tela (em %)
     top    → distância da borda SUPERIOR da tela (em %)
     width  → LARGURA da área clicável (em %)
     height → ALTURA da área clicável (em %)

   Passo a passo para descobrir os valores certos:
   1. Abra a imagem em qualquer editor (Paint, Photoshop, etc.)
   2. Anote as coordenadas do canto superior-esquerdo do objeto (x, y)
      e o seu tamanho (largura w, altura h) em pixels.
   3. Divida pelo tamanho total da imagem:
        left   = x / largura_da_imagem * 100  → resultado em %
        top    = y / altura_da_imagem  * 100  → resultado em %
        width  = w / largura_da_imagem * 100  → resultado em %
        height = h / altura_da_imagem  * 100  → resultado em %

   Dica de depuração:
   Para enxergar as áreas clicáveis enquanto ajusta,
   descomente (remova as barras //) da linha abaixo:
     background: rgba(255,0,0,0.3);
   Depois de ajustar, comente de volta para deixar invisível.
   ============================================================ */
.hotspot {
  position: absolute;
  display: block;
  background: transparent;
  cursor: pointer;
  z-index: 100;
  /* background: rgba(255,0,0,0.3); */
}

/* ============================================================
   BOTÃO VOLTAR
   ============================================================ */
.btn-voltar {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 30px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  border: 2px solid rgba(255,255,255,0.7);
  border-radius: 50px;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: background 0.2s;
  z-index: 200;
  white-space: nowrap;
}
.btn-voltar:hover {
  background: rgba(0,0,0,0.8);
}

/* ============================================================
   MODAL DE VÍDEO
   ============================================================ */
#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#modal-overlay.aberto {
  display: flex;
}
#modal-box {
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  max-width: 660px;
  width: 100%;
  position: relative;
}
#modal-titulo {
  font-family: 'Fredoka One', cursive;
  color: #3a7bd5;
  font-size: clamp(1.1rem, 3vw, 1.6rem);
  text-align: center;
  margin-bottom: 12px;
}
#modal-video-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
}
#modal-iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}
#modal-fechar {
  position: absolute;
  top: -13px;
  right: -13px;
  width: 32px;
  height: 32px;
  background: #e74c3c;
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  line-height: 32px;
  text-align: center;
}
#modal-fechar:hover { background: #c0392b; }

</style>

<script>
/* ============================================================
   NAVEGAÇÃO
============================================================ */
function irParaTela(id) {
  document.querySelectorAll('.tela').forEach(function(t) {
    t.classList.remove('ativa');
  });
  document.getElementById(id).classList.add('ativa');
}

window.addEventListener('load', function() {
  document.getElementById('tela-escola').addEventListener('click', function() {
    abrirModalNavegar('Escola', 'https://youtu.be/7k6Sk4zlr30', 'tela-mapa');
  });
});

var cenaMap = {
  'atelier':        'tela-atelier',
  'refeitorio':     'tela-refeitorio',
  'brinquedoteca':  'tela-brinquedoteca',
  'informatica':    'tela-informatica',
  'biblioteca':     'tela-biblioteca',
  'sala-aula':      'tela-sala-aula',
  'parquinho':      'tela-parquinho'
};
function irParaCena(id) {
  irParaTela(cenaMap[id]);
}

/* ============================================================
   MODAL
============================================================ */
var destinoAposModal = null;

function abrirModalNavegar(nome, youtubeLink, destino) {
  destinoAposModal = destino;
  abrirModal(nome, youtubeLink);
}

function abrirModal(nome, youtubeLink) {
  var titulo = nome + ' em Libras';
  var embedUrl = '';

  if (youtubeLink.startsWith('LINK_')) {
    titulo += '  ⚠️ link pendente';
  } else {
    var match = youtubeLink.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
    embedUrl = match
      ? 'https://www.youtube.com/embed/' + match[1] + '?autoplay=1'
      : youtubeLink;
  }

  document.getElementById('modal-titulo').textContent = titulo;
  document.getElementById('modal-iframe').src = embedUrl;
  document.getElementById('modal-overlay').classList.add('aberto');
}

function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('aberto');
  document.getElementById('modal-iframe').src = '';
  if (destinoAposModal) {
    irParaTela(destinoAposModal);
    destinoAposModal = null;
  }
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') fecharModal();
});
</script>
